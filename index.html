<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tarjima Platformasi - O'zbekcha Ovozli Tarjima</title>
    <!-- FontAwesome iconlari uchun -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .btn-google {
            background-color: #ffffff;
            color: #1f2937;
        }
        .btn-google:hover { background-color: #f3f4f6; }

        .btn-github {
            background-color: #24292e;
            color: #ffffff;
        }
        .btn-github:hover { background-color: #1b1f23; }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .upload-section {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            padding: 12px;
            justify-content: center;
            font-size: 1rem;
            margin-top: 10px;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .video-container {
            position: relative;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
        }

        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .admin-info {
            margin-top: 5px;
            color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .row { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-globe"></i> AI Video Tarjimon (O'zbekcha)
        </div>
        <div class="auth-buttons">
            <button class="btn btn-google" onclick="loginAction('Google')">
                <i class="fa-brands fa-google"></i> Google orqali kirish
            </button>
            <button class="btn btn-github" onclick="loginAction('GitHub')">
                <i class="fa-brands fa-github"></i> GitHub orqali kirish
            </button>
        </div>
    </header>

    <div class="main-container">
        <div class="upload-section">
            <h2 style="margin-bottom: 1.5rem;">Video Tarjima Sozlamalari</h2>
            
            <div class="form-group">
                <label for="videoUrl">YouTube yoki VK Video Havolasi (URL):</label>
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=... yoki https://vk.com/video...">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="sourceLang">Asl Til (Original):</label>
                    <select id="sourceLang">
                        <option value="zh">Xitoy (Mandarin)</option>
                        <option value="ja">Yapon</option>
                        <option value="ru" selected>Rus</option>
                        <option value="en">Ingliz</option>
                        <option value="de">Nemis</option>
                        <option value="fr">Fransuz</option>
                        <option value="ar">Arab</option>
                        <option value="tr">Turk</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="videoQuality">Video Sifati (Resolution):</label>
                    <select id="videoQuality">
                        <option value="144">144p</option>
                        <option value="240">240p</option>
                        <option value="360">360p</option>
                        <option value="480">480p</option>
                        <option value="720" selected>720p (HD)</option>
                        <option value="1080">1080p (Full HD)</option>
                        <option value="1440">1440p (2K)</option>
                        <option value="2048">2048p (2K Ultra)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startTranslation()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Tarjima qilish va Ovoz berish
            </button>
        </div>

        <!-- Video Chiqarish Joyi -->
        <div class="video-container" id="videoBox">
            <div class="placeholder-text">
                <i class="fa-solid fa-film" style="font-size: 3rem; margin-bottom: 10px; display: block;"></i>
                Videoni kiriting va tarjima tugmasini bosing. (To'liq ekran va yonbosh rejimini qo'llab-quvvatlaydi)
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Barcha huquqlar himoyalangan.</p>
        <div class="admin-info">
            Adminlar: <strong>egamberdiyovasilbek0@gmail.com</strong> | Tel/Telegram: <strong>+998 88 117 06 11</strong>
        </div>
    </footer>

    <script>
        function loginAction(provider) {
            alert(provider + " orqali tizimga kirish so'rovi yuborildi!");
        }

        function startTranslation() {
            const url = document.getElementById('videoUrl').value;
            const lang = document.getElementById('sourceLang').value;
            const quality = document.getElementById('videoQuality').value;
            const videoBox = document.getElementById('videoBox');

            if (!url) {
                alert("Iltimos, YouTube yoki VK video havolasini kiriting!");
                return;
            }

            videoBox.innerHTML = `
                <div class="placeholder-text">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 10px; display: block;"></i>
                    Video yuklanmoqda va sun'iy intellekt orqali O'zbek tiliga o'girilmoqda (${quality}p)...
                </div>
            `;

            // Namuna tariqasida video pleerni chiqarish (Haqiqiy loyihada backend orqali video yuklab olinib ovoz almashtiriladi)
            setTimeout(() => {
                videoBox.innerHTML = `
                    <video controls autoplay playsinline controlsList="nodownload">
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                        Sizning brauzeringiz videoni qo'llab-quvvatlamaydi.
                    </video>
                `;
            }, 2000);
        }
    </script>
</body>
</html>
